name: Publish public Maven distributions
on:
  push:
    branches: [main]
    paths: [distributions.json, 'scripts/**', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: public-maven-publication
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: matrix
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': json.load(open('distributions.json'))}) + '\n')
          PY
  publish:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Maven 3.9.9
        run: |
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz --output "$RUNNER_TEMP/maven.tar.gz"
          echo "a555254d6b53d267965a3404ecb14e53c3827c09c3b94b5678835887ab404556bfaf78dcfe03ba76fa2508649dca8531c74bca4d5846513522404d48e8c4ac8b  $RUNNER_TEMP/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          server-id: github-public
      - name: Publish and verify exact release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ matrix.artifact }}
          VERSION: ${{ matrix.version }}
          GROUP: ${{ matrix.group }}
          RELEASE_TAG: ${{ matrix.tag }}
        run: python3 scripts/publish.py
