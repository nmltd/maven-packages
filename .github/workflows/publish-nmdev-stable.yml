name: Publish stable public NMDEV 1.2.6
on:
  push:
    branches: [codex/public-nmdev-1.2.6]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          server-id: github-public
      - name: Publish and verify validated stable distribution
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT: nmdev-dist
          SOURCE_ARTIFACT: nmdev
          VERSION: 1.2.6
          GROUP: dev.nm
          RELEASE_TAG: nmdev-1.2.6-validated
        run: python3 scripts/publish.py
